[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alphascout"
version = "1.0.0"
description = "AlphaScout: Autonomous Equity Research, SEC Filing Analyst & Paper Brokerage Agent built with Google ADK"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "AlphaScout Engineering" }
]
dependencies = [
    "google-adk>=1.0.0",
    "google-genai>=1.0.0",
    "google-cloud-secret-manager>=2.20.0",
    "google-cloud-discoveryengine>=0.11.0",
    "google-cloud-dlp>=3.18.0",
    "google-cloud-logging>=3.10.0",
    "pydantic>=2.7.0",
    "yfinance>=0.2.40",
    "requests>=2.31.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-gcp-trace>=1.6.0",
    "python-json-logger>=2.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
alphascout-demo = "alphascout.cli:main"
alphascout-eval = "tests.eval.evaluate_agent:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
